<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Soporte GoPro">
<defs>
 <radialGradient id="bg" cx="58%" cy="20%" r="82%"><stop offset="0" stop-color="#4aa6ff"/><stop offset=".32" stop-color="#123f70"/><stop offset="1" stop-color="#061728"/></radialGradient>
 <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8efff" stop-opacity=".10"/><stop offset=".55" stop-color="#071321" stop-opacity=".02"/><stop offset="1" stop-color="#071321" stop-opacity=".32"/></linearGradient>
 <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#8be9ff" stroke-opacity=".12" stroke-width="1"/></pattern>
 <filter id="grade" color-interpolation-filters="sRGB">
   <feColorMatrix type="saturate" values=".18"/>
   <feComponentTransfer><feFuncR type="linear" slope=".80" intercept=".02"/><feFuncG type="linear" slope=".92" intercept=".03"/><feFuncB type="linear" slope="1.18" intercept=".06"/></feComponentTransfer>
