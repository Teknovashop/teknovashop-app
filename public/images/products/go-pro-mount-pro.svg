<ellipse cx="610" cy="715" rx="410" ry="85" fill="#69c7ff" opacity=".18" filter="url(#glow)"/>
<image href="/images/models/go-pro-mount.jpg" x="55" y="55" width="1090" height="790" preserveAspectRatio="xMidYMid meet" filter="url(#grade)" opacity=".94"/>
<rect width="1200" height="900" fill="url(#shade)"/>
<g fill="none" stroke="#c6f2ff" stroke-opacity=".22" stroke-width="2">
