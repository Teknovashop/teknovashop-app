name: Refresh package lock

on:
  push:
    branches:
      - feat/interactive-geometry-tools-20261007
    paths:
      - package.json
      - .github/workflows/refresh-package-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/interactive-geometry-tools-20261007
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "Teknovashop CI"
          git config user.email "teknovashop25@gmail.com"
          git add package-lock.json
          git commit -m "Refresh package lock for Framer Motion"
          git push origin HEAD:feat/interactive-geometry-tools-20261007
